    <main>
            <h2>Nytt innlegg</h2>

    <form id="admin-skjema" class="admin-skjema">
        <label for="tittel">Tittel</label>
        <input type="text" id="tittel" name="tittel" required>

        <label for="innhold">Innhold</label>
        <textarea id="innhold" name="innhold" rows="8" required></textarea>

        <label for="publisert_dato">Publiseringsdato</label>
        <input type="date" id="publisert_dato" name="publisert_dato" required>

        <label for="lokallag_id">Lokallag</label>
        <select id="lokallag_id" name="lokallag_id" required>
            <option value="">Laster lokallag</option>
        </select>

        <button type="submit">Publiser</button>
        <p id="melding"></p>
    </form>
