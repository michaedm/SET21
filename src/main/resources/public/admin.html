</head>
<body>
    <header>
        <a href="index.html">
    <img class="logo" src="img/nh-logo.jpg" alt="Norges Husflidslag, til forsiden">
</a>
        <h1>Østfold husflid</h1>
        <a href="login.html" class="logginn-knapp">Logg inn</a>
    
    </header>
    
      <nav class="nav">
    <ul>
        <li><a href="index.html">Siste nytt</a></li>
        <li><a href="lokallag.html">Finn lokallag</a></li>

    <aside>
      <a href="admin.html" class="admin-knapp">Admin</a>
    </aside>

    <main>
            <h2>Nytt innlegg</h2>

    <form id="admin-skjema" class="admin-skjema">
        <label for="tittel">Tittel</label>
        <input type="text" id="tittel" name="tittel" required>

        <label for="innhold">Innhold</label>
        <textarea id="innhold" name="innhold" rows="8" required></textarea>

        <label for="publisert_dato">Publiseringsdato</label>
        <input type="date" id="publisert_dato" name="publisert_dato" required>

        <label for="bilde">Bilde</label>
        <input type="file" id="bilde" name="bilde" accept="image/*">

        <button type="submit">Publiser</button>
        <p id="melding"></p>
    </form>


    <section class="bilde-boks">
    <figure class="forhandsvisning">
        <img id="forhandsvisning" alt="Forhåndsvisning av valgt bilde" hidden>
        <figcaption id="bilde-tekst">Ingen bilde valgt</figcaption>
    </figure>

    <input type="range" id="bilde-y" class="glider-y" name="bilde_y"
           min="0" max="100" value="50" form="admin-skjema"
           aria-label="Flytt bildet opp og ned">

    <input type="range" id="bilde-x" class="glider-x" name="bilde_x"
           min="0" max="100" value="50" form="admin-skjema"
           aria-label="Flytt bildet sidelengs">

    <label for="bilde" class="bilde-label">Last opp bilde</label>
    <input type="file" id="bilde" name="bilde" accept="image/*" form="admin-skjema">
</section>
    </main>
    
</body>
</html>
