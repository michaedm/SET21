<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs - Østfold Husflidslag</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html"><img class="logo" src="img/nh-logo.jpg" alt="bilde av logo"></a>
        <h1>Østfold husflid</h1>
        <a href="login.html" class="logginn-knapp">Logg inn</a>
    </header>

    <nav class="nav">
        <ul>
             <li><a href="index.html">Siste nytt</a></li>
            <li><a href="lokallag.html">Finn lokallag</a></li>
            <li><a href="kurs.html">Kurs</a></li>

        </ul>
        <aside>
            <a href="admin.html" class="admin-knapp">Admin</a>
        </aside>
    </nav>

    <main>
        <h2>Kurs</h2>
        <p class="ingress">Lær noe nytt, ta med deg garnet og møt andre som liker å skape. Velg en kategori eller se alle kursene.</p>

        <fieldset class="filter">
            <legend>Velg kategori</legend>

            <input type="radio" name="kat" id="f-alle" checked>
            <label for="f-alle">Alle</label>

            <input type="radio" name="kat" id="f-strikk">
            <label for="f-strikk">Strikking</label>

            <input type="radio" name="kat" id="f-hekling">
            <label for="f-hekling">Hekling</label>

            <input type="radio" name="kat" id="f-sy">
            <label for="f-sy">Søm og vev</label>

            <section class="kurs-liste" id="kurs-liste">
                <p>Kurs</p>
            </section>
        </fieldset>
    </main>

    <footer>
        <p>Østfold Husflidslag</p>
        <a href="kontaktoss.html" class="kontaktoss">Kontakt oss</a>
        <p>Sentralbord: 22 00 87 00</p>
        <a href="mailto:post@husflid.no">post@husflid.no</a>
    </footer>
    <script src="js/chatbot.js" defer></script>
    <script src="js/kurs.js" defer></script>
</body>
</html>
